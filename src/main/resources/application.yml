spring:
    application:
        name: cs-ai-agent
    profiles:
        active: local
    ai:
        dashscope:
            api-key: ${DASHSCOPE_API_KEY:${SPRING_AI_DASHSCOPE_API_KEY:}}
        mcp:
            client:
                stdio:
                    servers-configuration: classpath:mcp-servers.json
                toolcallback:
                    enabled: true
server:
    port: 8123
    servlet:
        context-path: /api

# springdoc-openapi ????????
springdoc:
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha
    api-docs:
        path: /v3/api-docs
    group-configs:
        - group: 'default'
          paths-to-match: '/**'
          packages-to-scan: cn.chengshuai.csaiagent.controller
# knife4j???????????????
knife4j:
    enable: true
    setting:
        language: zh_cn

search-api:
    api-key: ${SEARCH_API_KEY:}